# Reglas SAST personalizadas para CenfoPay (semana 3 · CIB-665)
#
# Criterio de severidad del curso (ver security/politica-umbrales.yml):
#   ERROR   -> vulnerabilidad explotable con evidencia de flujo de datos: BLOQUEA el pipeline.
#   WARNING -> patrón riesgoso que requiere revisión humana (triage): se reporta.
#   INFO    -> buena práctica / higiene: solo informativo.
#
# Prueba las reglas con:  semgrep --test security/semgrep/
# (usa los comentarios "ruleid:" y "ok:" de reglas-cenfopay.py)

rules:
  - id: cenfopay-sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Dato controlado por el usuario llega a una consulta SQL de CenfoPay sin
      parametrizar. Usa marcadores '?' y pasa los valores en la tupla de parámetros.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A05:2025 - Injection"
      confidence: HIGH
      category: security
    pattern-sources:
      - pattern: request.$ATRIBUTO
      - pattern: request.$METODO(...)
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: datetime.date.fromisoformat(...)
    pattern-sinks:
      - patterns:
          - pattern-inside: db.$FUNCION($SQL, ...)
          - metavariable-regex:
              metavariable: $FUNCION
              regex: ^(consultar|consultar_uno|ejecutar)$
          - focus-metavariable: $SQL

  - id: cenfopay-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Ruta de archivo construida con datos del usuario. Valida el nombre con una
      lista blanca y usa werkzeug.utils.safe_join para no salir de la carpeta.
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2025 - Broken Access Control"
      confidence: MEDIUM
      category: security
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
    pattern-sanitizers:
      - pattern: safe_join(...)
    pattern-sinks:
      - patterns:
          - pattern-inside: open($RUTA, ...)
          - focus-metavariable: $RUTA

  - id: cenfopay-ssti-render-template-string
    languages: [python]
    severity: ERROR
    message: >-
      render_template_string() recibe una plantilla construida con datos
      (f-string, concatenación o format). Usa una plantilla fija y pasa los
      datos como variables: render_template_string("{{ x }}", x=valor).
    metadata:
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      owasp: "A05:2025 - Injection"
      confidence: HIGH
      category: security
    pattern-either:
      - pattern: render_template_string(f"...", ...)
      - pattern: render_template_string("..." + $X, ...)
      - pattern: render_template_string("...".format(...), ...)
      - pattern: render_template_string("..." % $X, ...)

  - id: cenfopay-secreto-en-logs
    languages: [python]
    severity: ERROR
    message: >-
      Un valor sensible (contraseña, token o secreto) se escribe en los registros.
      Los logs se copian a SIEM, respaldos y consolas: elimina el dato del mensaje.
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2025 - Security Logging and Alerting Failures"
      confidence: MEDIUM
      category: security
    patterns:
      - pattern-either:
          - pattern: logging.$NIVEL(...)
          - pattern: $LOGGER.$NIVEL(...)
      - metavariable-regex:
          metavariable: $NIVEL
          regex: ^(debug|info|warning|error|critical|exception)$
      - pattern-regex: (?i)\{\s*\w*(password|passwd|secret|token|clave)\w*\s*\}

  - id: cenfopay-flask-debug-activo
    languages: [python]
    severity: ERROR
    message: >-
      El depurador de Werkzeug permite ejecutar código arbitrario si queda
      expuesto. Nunca uses debug=True fuera de tu máquina.
    metadata:
      cwe: "CWE-489: Active Debug Code"
      owasp: "A02:2025 - Security Misconfiguration"
      confidence: HIGH
      category: security
    pattern: $APP.run(..., debug=True, ...)

  - id: cenfopay-secreto-embebido
    languages: [python]
    severity: WARNING
    message: >-
      Posible secreto embebido en el código. Muévelo a un gestor de secretos o a
      una variable inyectada en tiempo de ejecución (ver semana 4).
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2025 - Authentication Failures"
      confidence: LOW
      category: security
    pattern-either:
      - patterns:
          - pattern: $NOMBRE = "$VALOR"
          - metavariable-regex:
              metavariable: $NOMBRE
              regex: (?i).*(secret|token|password|passwd|clave|api_key).*
          - metavariable-regex:
              metavariable: $VALOR
              regex: ^.{12,}$
      - patterns:
          - pattern: os.getenv($CLAVE, "$VALOR")
          - metavariable-regex:
              metavariable: $CLAVE
              regex: (?i).*(secret|token|password|passwd|clave).*
          - metavariable-regex:
              metavariable: $VALOR
              regex: ^.{6,}$
