# Semana 4 · Inyección segura de secretos como ARCHIVOS (se SUMA a los anteriores)
#   docker compose -f docker-compose.yml -f compose.endurecido.yml -f compose.secretos.yml up -d
#
# Los valores salen de variables del entorno (.env en tu equipo; secretos del
# GitHub Environment en el pipeline) y llegan al contenedor como archivos en
# /run/secrets/: no aparecen en "docker inspect" ni en el entorno del proceso.
services:
  app:
    environment: !override
      DB_ENGINE: postgres
      DB_HOST: db
      DB_USER: cenfopay_app
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRET_KEY_FILE: /run/secrets/secret_key
      COOKIE_SEGURA: "false"            # laboratorio sin TLS: riesgo residual documentado
    secrets:
      - db_password
      - secret_key

secrets:
  db_password:
    environment: DB_PASSWORD
  secret_key:
    environment: SECRET_KEY
